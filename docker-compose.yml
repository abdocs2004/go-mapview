version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gomap_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gomap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gomap

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gomap_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - gomap

volumes:
  postgres_data:

networks:
  gomap:
    driver: bridge
